name: Multiplatform CI/CD (Desktop + Android + iOS)

on:
  push:
    branches: [ master, main, "feature/**" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Desktop & Core Tests (Windows, Linux, macOS)
  # -------------------------------------------------------------
  test-and-desktop:
    name: Build & Test Core (Windows, Linux, macOS)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: |
          dotnet restore Fujify/Fujify.csproj
          dotnet restore Fujify.Tests/Fujify.Tests.csproj

      - name: Run Test Suite
        timeout-minutes: 10
        run: dotnet test Fujify.Tests/Fujify.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal" --logger "trx;LogFileName=test_results.trx" --blame-hang --blame-hang-timeout 2m

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: Fujify.Tests/TestResults/

      - name: Publish Windows Desktop x64
        run: |
          dotnet publish Fujify/Fujify.csproj -f net10.0 -c Release -r win-x64 --self-contained true -o ./publish/win-x64

      - name: Publish Windows Desktop ARM64
        run: |
          dotnet publish Fujify/Fujify.csproj -f net10.0 -c Release -r win-arm64 --self-contained true -o ./publish/win-arm64

      - name: Publish Linux Desktop x64
        run: |
          dotnet publish Fujify/Fujify.csproj -f net10.0 -c Release -r linux-x64 --self-contained true -o ./publish/linux-x64

      - name: Upload Desktop Artifacts (Windows & Linux)
        uses: actions/upload-artifact@v4
        with:
          name: fujify-desktop-builds
          path: ./publish/

  # -------------------------------------------------------------
  # 2. macOS Desktop (Apple Silicon & Intel with Native dnglab_ffi)
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS Desktop (Apple Silicon & Intel)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache Rust Toolchain & Target Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/dnglab_ffi/target/
            tools/Raw2Raf/target/
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('native/dnglab_ffi/Cargo.lock', 'native/dnglab_ffi/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-

      - name: Build Native Libraries & Package macOS Apps
        run: |
          chmod +x ./package_macos.sh
          ./package_macos.sh

      - name: Upload macOS Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fujifier-v2.1.0-macOS-AppleSilicon
          path: release/Fujifier-v2.1.0-macOS-AppleSilicon.zip

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fujifier-v2.1.0-macOS-Intel
          path: release/Fujifier-v2.1.0-macOS-Intel.zip

  # -------------------------------------------------------------
  # 3. Android App (APK & AAB)
  # -------------------------------------------------------------
  build-android:
    name: Build Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET with Workloads
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Restore Android Project
        run: dotnet restore Fujify.Android/Fujify.Android.csproj

      - name: Build Android APK
        run: |
          mkdir -p ./publish-android
          dotnet build Fujify.Android/Fujify.Android.csproj -c Release -r android-arm64 -p:AndroidPackageFormat=apk
          SIGNED_APK=$(find Fujify.Android/bin/Release -name "*Signed.apk" | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" ./publish-android/Fujify-v2.1.0-Android-arm64.apk
          else
            cp $(find Fujify.Android/bin/Release -name "*.apk" | head -n 1) ./publish-android/Fujify-v2.1.0-Android-arm64.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fujify-android-apk
          path: ./publish-android/Fujify-v2.1.0-Android-arm64.apk

  # -------------------------------------------------------------
  # 3. iOS App (iPhone & iPad)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS App & IPA (iPhone & iPad)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove global.json for iOS Job
        run: rm -f global.json

      - name: Select Latest Xcode
        run: |
          echo "Listing all installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          SELECTED_XCODE=""
          for xc in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode.app $(ls -d /Applications/Xcode*.app 2>/dev/null); do
            if [ -x "$xc/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++" ] && [ -d "$xc/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs" ]; then
              if "$xc/Contents/Developer/usr/bin/xcodebuild" -sdk macosx -version >/dev/null 2>&1; then
                echo "Found verified working Xcode toolchain: $xc"
                SELECTED_XCODE="$xc"
                break
              fi
            fi
          done
          if [ -n "$SELECTED_XCODE" ]; then
            echo "Selecting Xcode: $SELECTED_XCODE"
            sudo xcode-select -s "$SELECTED_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun -find clang++
          xcrun -find dsymutil

      - name: Setup .NET with Workloads
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache .NET iOS Workloads
        id: cache-dotnet-ios
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/sdk-manifests
            ~/.dotnet/metadata/workloads
            /usr/local/share/dotnet/sdk-manifests
            /usr/local/share/dotnet/metadata/workloads
          key: ${{ runner.os }}-dotnet-ios-workload-10.0
          restore-keys: |
            ${{ runner.os }}-dotnet-ios-workload-

      - name: Install iOS Workload
        if: steps.cache-dotnet-ios.outputs.cache-hit != 'true'
        run: dotnet workload install ios

      - name: Cache Rust iOS Toolchain & Target Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/dnglab_ffi/target/
            tools/Raw2Raf/target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('native/dnglab_ffi/Cargo.lock', 'native/dnglab_ffi/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-

      - name: Build Native Rust Libraries for iOS (dnglab_ffi & raw2raf_ffi)
        run: |
          echo "=== Setting up Rust aarch64-apple-ios target ==="
          rustup target add aarch64-apple-ios

          echo "=== Building native dnglab_ffi for iOS ==="
          cd native/dnglab_ffi
          cargo build --release --target aarch64-apple-ios
          cd ../..

          echo "=== Building native raw2raf_ffi for iOS ==="
          if [ ! -d "tools/Raw2Raf" ]; then
            mkdir -p tools
            git clone --depth 1 https://github.com/ip-web/Raw2Raf.git tools/Raw2Raf
          fi
          cd tools/Raw2Raf
          cargo build --release --target aarch64-apple-ios
          cd ../..

          mkdir -p Fujify.iOS/Frameworks
          if [ -f native/dnglab_ffi/target/aarch64-apple-ios/release/libdnglab_ffi.dylib ]; then
            cp native/dnglab_ffi/target/aarch64-apple-ios/release/libdnglab_ffi.dylib Fujify.iOS/Frameworks/
          fi
          if [ -f tools/Raw2Raf/target/aarch64-apple-ios/release/libraw2raf_ffi.dylib ]; then
            cp tools/Raw2Raf/target/aarch64-apple-ios/release/libraw2raf_ffi.dylib Fujify.iOS/Frameworks/
          fi
          echo "Frameworks contents:"
          ls -la Fujify.iOS/Frameworks/

      - name: Restore iOS Project
        run: dotnet restore Fujify.iOS/Fujify.iOS.csproj

      - name: Build and Package iOS IPA
        run: |
          rm -rf ./publish
          dotnet build Fujify.iOS/Fujify.iOS.csproj -f net10.0-ios -c Release -r ios-arm64 -p:EnableCodeSigning=false -p:CodesignKey="-" -p:ValidateXcodeVersion=false -p:_SuppressXcodeRequirementCheck=true -p:Registrar=dynamic -p:DynamicRegistrationSupported=true -p:MtouchExtraArgs="--registrar:dynamic" -p:MtouchEnableDsym=false
          APP_PATH=$(find Fujify.iOS/bin -name "*.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          # Ensure static archives (.a) are removed from the .app bundle to prevent codesign / Sideloadly failures
          find "$APP_PATH" -name "*.a" -delete
          # Bundle native dynamic libraries into .app bundle root and Frameworks
          mkdir -p "$APP_PATH/Frameworks"
          if [ -f native/dnglab_ffi/target/aarch64-apple-ios/release/libdnglab_ffi.dylib ]; then
            cp native/dnglab_ffi/target/aarch64-apple-ios/release/libdnglab_ffi.dylib "$APP_PATH/Frameworks/"
            cp native/dnglab_ffi/target/aarch64-apple-ios/release/libdnglab_ffi.dylib "$APP_PATH/"
          fi
          if [ -f tools/Raw2Raf/target/aarch64-apple-ios/release/libraw2raf_ffi.dylib ]; then
            cp tools/Raw2Raf/target/aarch64-apple-ios/release/libraw2raf_ffi.dylib "$APP_PATH/Frameworks/"
            cp tools/Raw2Raf/target/aarch64-apple-ios/release/libraw2raf_ffi.dylib "$APP_PATH/"
          fi
          mkdir -p ./publish/Payload
          cp -R "$APP_PATH" ./publish/Payload/
          echo "Verifying app bundle contents:"
          ls -la ./publish/Payload/*.app/
          ls -la ./publish/Payload/*.app/Frameworks/ || true
          file ./publish/Payload/*.app/Fujify.iOS || true
          cd ./publish
          zip -r -y Fujify-v2.1.0-iOS.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fujify-ios-ipa
          path: ./publish/Fujify-v2.1.0-iOS.ipa

