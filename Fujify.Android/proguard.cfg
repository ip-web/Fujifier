# Preserve .NET Android / Mono runtime & JNI
-keep class net.dot.jni.** { *; <init>(); }
-keep class net.dot.android.** { *; }
-keep class mono.** { *; <init>(...); }
-keep class android.runtime.** { <init>(...); }
-keep class assembly_mono_android.android.runtime.** { <init>(...); }

# Preserve native methods across all classes
-keepclasseswithmembernames class * {
    native <methods>;
}

# Preserve Avalonia UI & Activities
-keep class Avalonia.Android.** { *; }
-keep public class * extends Avalonia.Android.AvaloniaActivity { *; }
-keep public class * extends Avalonia.Android.AvaloniaMainActivity { *; }
-keep class fujify.android.** { *; }
-keep class Fujify.Android.** { *; }

# Preserve SkiaSharp native bindings
-keep class SkiaSharp.** { *; }

# Preserve Google Mobile Ads (Lite)
-keep class com.google.android.gms.ads.** { *; }

# Preserve AndroidX components
-keep class androidx.activity.** { *; }
-keep class androidx.lifecycle.** { *; }
